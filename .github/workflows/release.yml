name: Release

# Runs automatically on every push to main, or manually from the Actions tab
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # required to create a Release/tag and upload files

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Only write GEMINI_API_KEY to .env if the secret is actually set,
      # otherwise the Secrets Gradle Plugin generates invalid BuildConfig code.
      - name: Create .env file
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          else
            echo "GEMINI_API_KEY secret not set, skipping .env entry"
          fi

      # (optional) rebuild google-services.json if your project needs it
      - name: Decode google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      # Generate a throwaway signing keystore at build time —
      # no KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD secrets needed.
      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"

      - name: Build release APK & AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: ./gradlew assembleRelease bundleRelease

      - name: Locate build outputs
        id: outputs
        run: |
          echo "apk_path=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "aab_path=$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Set release tag
        id: tag
        run: echo "name=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Release ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            ${{ steps.outputs.outputs.apk_path }}
            ${{ steps.outputs.outputs.aab_path }}

      # Retry once if the upload failed (e.g. transient "other side closed" network errors)
      - name: Retry GitHub Release upload if it failed
        if: steps.release.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Release ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            ${{ steps.outputs.outputs.apk_path }}
            ${{ steps.outputs.outputs.aab_path }}
